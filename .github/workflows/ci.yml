name: ci

# Build + test on every push to main and every pull request, so contributors get fast feedback and
# a PR can't merge red. Pure-Rust single static binary — no C toolchain needed. Uses the built-in
# GITHUB_TOKEN only; runs on forks' PRs too (pull_request, not pull_request_target — no secrets
# exposed to untrusted code).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustc -V && cargo -V

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --bin aizen

      - name: Test
        run: cargo test --bin aizen

  lint:
    name: fmt + clippy (advisory)
    runs-on: ubuntu-latest
    # Advisory only: the tree carries pre-existing warnings, so this surfaces fmt/clippy findings
    # without gating merges. Contributors are asked to clear anything THEY introduce (see CONTRIBUTING).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Components
        run: rustup component add rustfmt clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --bin aizen
