name: cla

# Require every contributor to agree to the CLA (CLA.md) once before their PR can merge.
# Uses the community `contributor-assistant/github-action`, which records signatures in a JSON
# file committed to a branch of this same repo — no external service, no extra secret beyond the
# built-in GITHUB_TOKEN.
#
# A contributor agrees by commenting the exact sentence on their PR:
#     I have read the CLA Document and I hereby sign the CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write        # write the signatures file
  pull-requests: write   # comment on / label the PR
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only run the comment trigger for the sign sentence or the recheck command; always run for PRs.
    if: >
      (github.event_name == 'issue_comment' &&
        (contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') ||
         contains(github.event.comment.body, 'recheck'))) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: CLA assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'cla/signatures.json'
          path-to-document: 'https://github.com/dawnofcd/aizen/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'dawnofcd,dependabot[bot],aizen-sync[bot]'
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before we can merge it, please read our
            [Contributor License Agreement](https://github.com/dawnofcd/aizen/blob/main/CLA.md)
            and, if you agree, post a comment below with **exactly** this sentence:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✅'
