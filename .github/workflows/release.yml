name: release

# Build optimized native binaries on each OS runner and attach them to the GitHub Release for the
# tag. Cross-compiling to Linux/macOS from the (Windows) dev machine is impractical — the C dep
# `ring` needs a native toolchain — so we let GitHub's own runners build natively per platform.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build binaries for (e.g. v0.1.0)'
        required: true
        default: v0.1.0

permissions:
  contents: write   # needed for `gh release upload`

jobs:
  build:
    name: ${{ matrix.plat }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one platform failing must not cancel the others
      matrix:
        include:
          - { os: ubuntu-latest,  plat: linux-x86_64,   ext: '' }
          - { os: macos-latest,   plat: macos-aarch64,  ext: '' }   # Apple Silicon runner
          - { os: windows-latest, plat: windows-x86_64, ext: '.exe' }
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install ALSA headers (Linux only — cpal voice capture needs libasound at build time)
        if: runner.os == 'Linux'
        # `cpal` (the `voice` feature) links ALSA on Linux. libasound2-dev + pkg-config are a
        # BUILD-time probe only; end users need only the runtime libasound.so.2, present on every
        # desktop distro. No effect on Windows/macOS (WASAPI/CoreAudio are system frameworks).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Show toolchain
        run: rustc -V && cargo -V

      - name: Build (release, dense tier on)
        # `--features dense` ships the model2vec semantic backend so the dense retrieval tier is
        # live in the released binary (gated ON by default; see `memory::settings`). The model
        # weights are NOT bundled — a user runs `aizen memory model-download` once to cache
        # potion-base-8M (~30 MB) into ~/.aizen/models/. The Windows runner is MSVC (not the
        # windows-gnu dev box), so the getrandom-0.3 raw-dylib link wall doesn't apply here.
        run: cargo build --release --features dense --bin aizen

      - name: Package the default binary
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          asset="aizen-${tag}-${{ matrix.plat }}${{ matrix.ext }}"
          cp "target/release/aizen${{ matrix.ext }}" "$asset"
          # E5.2: a SHA-256 beside every binary, in `sha256sum` line shape, so `aizen update`
          # can refuse a corrupt or tampered download. One file per asset (not one SHA256SUMS)
          # because the matrix jobs upload concurrently and would clobber a shared file.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          ls -lh "$asset" "$asset.sha256"
          echo "$asset" >> assets.txt

      # The voice build is a SECOND, opt-in artifact, not the default one: `voice` links cpal
      # (ALSA on Linux), and a binary that needs libasound.so.2 just to start would be a
      # regression for headless servers that never use a microphone. The engine and speech models
      # are NOT bundled — `aizen voice install` fetches them into ~/.aizen/voice/ — and the feature
      # is inert at runtime unless `voice.enabled: true`.
      #
      # `aizen update` inside a voice build resolves the `-voice` suffix (see
      # `features::update::asset_suffix`), so the variant survives self-updates instead of being
      # silently replaced by the plain binary.
      - name: Build (release, dense tier + voice)
        run: cargo build --release --features dense,voice --bin aizen

      - name: Package the voice binary
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          asset="aizen-${tag}-${{ matrix.plat }}-voice${{ matrix.ext }}"
          cp "target/release/aizen${{ matrix.ext }}" "$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          ls -lh "$asset" "$asset.sha256"
          echo "$asset" >> assets.txt

      - name: Publish binaries to this repo's release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"

          # Release on THIS repo only (no cross-repo mirror). On the public source repo this IS the
          # download channel the installers pull from; on the private repo it's a build record.
          # Uses the built-in job token — no PAT needed. The matrix jobs race on `release create`,
          # so swallow "already exists".
          gh release create "$tag" --repo "${{ github.repository }}" --title "$tag" \
            --notes "Automated build for $tag." 2>/dev/null || true
          while read -r asset; do
            gh release upload "$tag" "$asset" "$asset.sha256" --clobber --repo "${{ github.repository }}"
          done < assets.txt
