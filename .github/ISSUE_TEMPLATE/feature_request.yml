name: Feature request
description: Suggest an idea or improvement for Aizen
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a bigger change in mind? Open this first and describe the plan **before** writing a PR —
        it saves you from a rejected PR. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point. "I'm always frustrated when ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one.
    validations:
      required: false
