name: Bug report
description: Something in Aizen isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first — it may already be known.
        **Do not report security vulnerabilities here** — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I run `aizen ...`, it ... but I expected ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands / inputs. A minimal repro gets fixed fastest.
      placeholder: |
        1. Run `aizen ...`
        2. Type ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aizen version
      description: Output of `aizen --version` (or the release tag / commit).
      placeholder: v0.4.7
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: Paste any error text. Redact API keys and secrets first.
      render: shell
    validations:
      required: false
