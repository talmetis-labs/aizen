# Template only. Copy to `secret.yaml`, fill it in, and DO NOT commit that copy
# (`deploy/k8s/secret.yaml` is in .gitignore).
#
# Prefer creating the Secret from literals so no file on disk ever holds the tokens:
#
#   kubectl -n aizen create secret generic aizen-secrets \
#     --from-literal=AIZEN_API_KEY='sk-...' \
#     --from-literal=AIZEN_TELEGRAM_TOKEN='123456:ABC-...'
#
# In a real cluster, prefer a sealed/external secret operator over either approach.
#
# Note: `stringData` values are stored base64-encoded by the apiserver, which is ENCODING, not
# encryption — anyone who can read Secrets in this namespace can read these. Enable encryption at
# rest and restrict RBAC accordingly.
apiVersion: v1
kind: Secret
metadata:
  name: aizen-secrets
  namespace: aizen
type: Opaque
stringData:
  # Model endpoint credential. Required.
  AIZEN_API_KEY: "REPLACE_ME"

  # Telegram bot token from @BotFather. Required for `aizen serve`.
  # One token = one poller: see the 409 note in README.md.
  AIZEN_TELEGRAM_TOKEN: "REPLACE_ME"

  # Optional: web search. Without a key, `web_search` returns "add a key" rather than degrading.
  # AIZEN_TAVILY_API_KEY: ""

  # Optional: raises the reader quota and adds a search fallback.
  # AIZEN_JINA_API_KEY: ""

  # Optional: raises GitHub API limits to 5000 req/h.
  # AIZEN_GITHUB_TOKEN: ""

  # Optional: for `aizen discord serve` instead of Telegram.
  # AIZEN_DISCORD_BOT_TOKEN: ""
